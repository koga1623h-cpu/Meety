  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = url;
  document.head.appendChild(link);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #ffffff;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

}

.header-date{

.tab-bar{

  text-transform:uppercase;white-space:nowrap;
}
.tab-btn.active{color:var(--text);border-bottom:2px solid transparent;background-image:linear-gradient(90deg,#e84040 0%,#e07820 20%,#c8a820 38%,#40a860 55%,#2888cc 75%,#7040c0 100%);background-size:100% 2px;background-position:bottom;background-repeat:no-repeat;}
.tab-btn svg{width:12px;height:12px;}
.screens-wrap{flex:1;overflow:hidden;position:relative;}
.screens-slider{display:flex;height:100%;transition:transform .28s cubic-bezier(.4,0,.2,1);}

.sec-lbl{

.cal-nav-btn{

}
.cal-nav-btn:active{border-color:var(--border2);}
.cal-month{

  flex:1;text-align:center;color:var(--text);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 20px 14px;}
.cal-dow{
  font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);
  text-align:center;padding:5px 0;letter-spacing:.06em;
}
.cal-day{
  font-family:'DM Mono',monospace;font-size:12px;

  min-height:34px;
}
.cal-day.mtg{color:var(--text);font-weight:500;cursor:pointer;transition:background .12s;}
.cal-day.mtg:active{background:var(--surface);}
.cal-day.mtg.has-rec::after{content:'';display:block;width:3px;height:3px;background:linear-gradient(90deg,#e84040 0%,#e07820 20%,#c8a820 38%,#40a860 55%,#2888cc 75%,#7040c0 100%);border-radius:50%;margin-top:2px;}
.cal-day.today{background:var(--text);color:var(--bg);}
.cal-day.today::after{background:var(--bg)!important;}
.cal-day.out{color:var(--surface2);}
.cal-day.hol{color:var(--danger);}
.up-card{
  padding:14px 20px;border-bottom:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .12s;
}
.up-card:active{background:var(--surface);}
.up-card-left{flex:1;}
.up-card-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-bottom:3px;letter-spacing:.05em;}
.up-card-title{font-size:14px;font-weight:500;color:var(--text);}
.up-card-note{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);margin-top:2px;}
.up-card-arrow{color:var(--border);}
.up-card-arrow svg{width:14px;height:14px;}
.up-card.dim{opacity:.28;}
.ag-hero{padding:20px 20px 16px;border-bottom:1px solid var(--border2);}
.ag-date-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-bottom:5px;letter-spacing:.05em;}
.ag-title-lbl{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.06em;color:var(--text);line-height:1.1;}
.prev-wrap{padding:12px 20px 14px;border-bottom:1px solid var(--border);}
.prev-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.prev-tag{background:var(--surface);border:1px solid var(--border);padding:4px 9px;font-size:11px;color:var(--text2);}
.no-memo{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-top:8px;display:block;}
.ag-list{padding:0 20px;}
.ag-row{display:flex;align-items:center;gap:12px;padding:13px 0 6px 10px;border-bottom:none;border-left:3px solid var(--border);}
.ag-row-wrap{border-bottom:1px solid var(--border);padding-bottom:6px;}
.ag-row-wrap:last-child{border-bottom:none;}
.ag-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);min-width:20px;letter-spacing:.04em;}
.ag-name{flex:1;font-size:14px;color:var(--text);}
.ag-min{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}
.sub-list{padding:2px 0 4px 32px;}
.sub-row{display:flex;align-items:center;gap:8px;padding:3px 0 3px 10px;border-left:2px solid var(--border);}
.sub-bullet{width:4px;height:4px;background:var(--text3);border-radius:50%;flex-shrink:0;}
.sub-name{flex:1;font-size:12px;color:var(--text2);}
.sub-edit-area{background:var(--surface);border-left:2px solid var(--border);margin:4px 0 4px 20px;}
.sub-edit-row{display:flex;align-items:center;gap:6px;padding:5px 10px;}
.sub-edit-input{flex:1;background:var(--bg);border:1px solid var(--border);padding:7px 9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;-webkit-appearance:none;}
.sub-edit-input:focus{border-color:var(--text);}
.add-sub-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;background:none;border:none;color:var(--accent);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;}
.xbtn-sm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 6px;min-height:36px;}
.xbtn-sm:active{color:var(--danger);}
.timer-subs{margin-top:10px;}
.timer-sub-item{display:flex;align-items:center;gap:8px;padding:5px 0 5px 10px;border-left:2px solid var(--border);margin-bottom:4px;cursor:pointer;}
.tsub-chk{width:14px;height:14px;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:background .12s,color .12s;}
.tsub-chk.chk{background:var(--text);border-color:var(--text);color:var(--bg);}
.tsub-txt{font-size:12px;color:var(--text2);transition:all .12s;}
.tsub-txt.chk{text-decoration:line-through;color:var(--text3);}
.action-bar{
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border2);background:var(--bg);
  position:sticky;bottom:0;display:flex;gap:8px;
}
.btn-main{
  flex:1;border:none;padding:14px;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;
  cursor:pointer;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .12s;
}
.btn-main.black{background:var(--text);color:var(--bg);}
.btn-main.orange{background:var(--accent);color:#fff;}
.btn-main:active{opacity:.72;}
.btn-sub{
  background:none;border:1px solid var(--border);padding:14px 16px;
  color:var(--text2);font-family:'DM Mono',monospace;
  font-size:11px;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;
}
.btn-sub:active{background:var(--surface);}
.timer-overlay{
  display:none;position:fixed;inset:0;background:var(--bg);z-index:200;
  flex-direction:column;max-width:480px;margin:0 auto;
  padding-top:env(safe-area-inset-top);
}
.timer-overlay.show{display:flex;}
.timer-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border2);flex-shrink:0;
}
.timer-close{
  background:none;border:1px solid var(--border);padding:6px 14px;
  font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);
  cursor:pointer;letter-spacing:.08em;text-transform:uppercase;
}
.timer-close:active{background:var(--surface);}
.timer-step{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.1em;}
.timer-body{flex:1;display:flex;flex-direction:column;padding:24px 20px 20px;position:relative;overflow:hidden;}
.timer-topic-name{
  font-family:'Bebas Neue',sans-serif;font-size:30px;
  letter-spacing:.06em;color:var(--text);margin-bottom:24px;line-height:1.2;
}
.timer-digits{
  font-family:'Bebas Neue',sans-serif;font-size:80px;
  letter-spacing:.04em;line-height:1;color:var(--text);margin-bottom:6px;
}
.timer-digits.warn{color:var(--accent);}
.timer-status{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px;}
.timer-track{height:1px;background:var(--border);margin-bottom:24px;}
.timer-fill{height:1px;background:linear-gradient(90deg,#e84040 0%,#e07820 20%,#c8a820 38%,#40a860 55%,#2888cc 75%,#7040c0 100%);background-size:1000px 1px;transition:width 1s linear;}
.timer-fill.warn{background:linear-gradient(90deg,#e84040 0%,#e07820 20%,#c8a820 38%,#40a860 55%,#2888cc 75%,#7040c0 100%);background-size:1000px 1px;}
.timer-btns{display:flex;gap:6px;margin-bottom:10px;}
.t-btn{
  flex:1;padding:13px 6px;border:1px solid var(--border);background:var(--bg);
  color:var(--text);font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .12s;
}
.t-btn:active{background:var(--surface);}
.t-btn.solid{background:var(--text);color:var(--bg);border-color:var(--text);}
.t-btn.solid:active{opacity:.72;}
.t-next-btn{
  width:100%;padding:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;margin-bottom:22px;transition:background .12s;
}
.t-next-btn:active{background:var(--surface);}
.steps-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase;}
.step-dots{display:flex;gap:4px;flex-wrap:wrap;}
.sdot{width:8px;height:2px;background:var(--border);}
.sdot.done{background:var(--text3);}
.sdot.cur{background:var(--accent);}
.done-wrap{flex:1;display:flex;flex-direction:column;padding:28px 20px 20px;}
.done-h{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:.06em;margin-bottom:4px;line-height:1;background:linear-gradient(90deg,#e84040 0%,#e07820 20%,#c8a820 38%,#40a860 55%,#2888cc 75%,#7040c0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.done-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px;}
.memo-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);
  padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  resize:none;min-height:100px;outline:none;margin-bottom:12px;
  transition:border-color .15s;-webkit-appearance:none;
}
textarea:focus{border-color:var(--text);}
textarea::placeholder{color:var(--text3);}
.done-btns{display:flex;gap:8px;}
.setting-block{border-bottom:1px solid var(--border);}
.setting-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.sr-label{flex:1;font-size:14px;color:var(--text);}
.sr-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:.04em;}
.edit-input{
  flex:1;background:var(--surface);border:1px solid var(--border);
  padding:9px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;-webkit-appearance:none;
}
.edit-input:focus{border-color:var(--text);}
.num-input{width:52px;text-align:center;padding:9px 5px;}
.xbtn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px 8px;min-height:44px;}
.xbtn:active{color:var(--danger);}
.add-btn{
  display:block;width:calc(100% - 40px);margin:12px 20px;padding:12px;
  border:1px solid var(--border);background:none;color:var(--text2);
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;text-align:center;
}
.add-btn:active{background:var(--surface);}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--text);padding:9px 16px;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--bg);
  opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:300;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* ── 今日のトピック ── */
.today-topic-wrap{padding:12px 20px 14px;border-bottom:1px solid var(--border);}
.today-topic-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.today-topic-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;}
.today-topic-save{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--accent);background:none;border:none;cursor:pointer;text-transform:uppercase;padding:2px 0;}
.today-topic-save:active{opacity:.6;}
.topic-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--border);}
.topic-item:last-of-type{border-bottom:none;}
.topic-item-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--accent);}
.topic-item-text{flex:1;font-size:13px;color:var(--text);}
.topic-item-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px;}
.topic-item-del:active{color:var(--danger);}
.topic-add-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.topic-input{flex:1;background:var(--surface);border:1px solid var(--border);padding:9px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;-webkit-appearance:none;}
.topic-input:focus{border-color:var(--accent);}
.topic-add-btn{padding:9px 14px;background:var(--text);color:var(--bg);border:none;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;cursor:pointer;white-space:nowrap;}
.topic-add-btn:active{opacity:.72;}
.topic-empty{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);padding:4px 0;}
</style>
</head>

</div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

  <button class="tab-btn" id="tab1" onclick="goTab(1)">

  </button>
  <button class="tab-btn" id="tab2" onclick="goTab(2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

</div>

<div class="screens-wrap">
<div class="screens-slider" id="slider">

  <div class="screen" id="s2">
    <div class="sec-lbl">Agenda items</div>

</div>
</div>

<div class="timer-overlay" id="timerOv">
  <div class="timer-hdr">
    <button class="timer-close" onclick="closeTimer()">← Back</button>
    <span class="timer-step" id="tStep"></span>
  </div>
  <div class="timer-body" id="tBody">
    <svg id="timerBg" style="position:absolute;right:-10px;top:10px;opacity:0.06;pointer-events:none;z-index:0;" width="160" height="160" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(50,50)">
    <ellipse rx="20" ry="9" fill="#e84040" transform="rotate(0) translate(18,0)"/>
    <ellipse rx="20" ry="9" fill="#e07820" transform="rotate(51.4) translate(18,0)"/>
    <ellipse rx="20" ry="9" fill="#c8a820" transform="rotate(102.8) translate(18,0)"/>
    <ellipse rx="20" ry="9" fill="#40a860" transform="rotate(154.2) translate(18,0)"/>
    <ellipse rx="20" ry="9" fill="#2888cc" transform="rotate(205.7) translate(18,0)"/>
    <ellipse rx="20" ry="9" fill="#7040c0" transform="rotate(257.1) translate(18,0)"/>
    <ellipse rx="20" ry="9" fill="#e84040" transform="rotate(308.5) translate(18,0)"/>
  </g>
</svg>
    <div style="position:relative;z-index:1;display:flex;flex-direction:column;flex:1;">
    <div class="timer-topic-name" id="tTopic"></div>
    <div class="timer-digits" id="tDigits">00:00</div>
    <div class="timer-status" id="tStat">Stopped</div>
    <div class="timer-track"><div class="timer-fill" id="tFill" style="width:100%"></div></div>
    <div class="timer-btns">
      <button class="t-btn solid" id="tStartBtn" onclick="tStart()">Start</button>
      <button class="t-btn" onclick="tPause()">Pause</button>
      <button class="t-btn" onclick="tReset()">Reset</button>
    </div>
    <button class="t-next-btn" onclick="tNext()">Next →</button>
    <div class="steps-lbl">Progress</div>
    <div class="step-dots" id="tDots"></div>
    <div class="timer-subs" id="tSubs" style="display:none;"></div>
    </div>
  </div>
  <div class="done-wrap" id="tDone" style="display:none;">
    <div class="done-h">Done!</div>
    <div class="done-sub">All agenda completed</div>
    <div style="height:1px;background:linear-gradient(90deg,#e84040 0%,#e07820 20%,#c8a820 38%,#40a860 55%,#2888cc 75%,#7040c0 100%);margin-bottom:16px;"></div>
    <div id="doneTodayTopics"></div>
    <div class="memo-lbl">今回のメモ（改行で複数タグに）</div>
    <textarea id="memoTa" placeholder="決定事項、アクションアイテムなど..."></textarea>
    <div class="done-btns">
      <button class="btn-main orange" onclick="saveMemo()" style="flex:2;">保存して終了</button>
      <button class="btn-sub" onclick="closeTimer()">Skip</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const HOL={'2025-01-01':1,'2025-01-13':1,'2025-02-11':1,'2025-02-23':1,'2025-02-24':1,'2025-03-20':1,'2025-04-29':1,'2025-05-03':1,'2025-05-04':1,'2025-05-05':1,'2025-05-06':1,'2025-07-21':1,'2025-08-11':1,'2025-09-15':1,'2025-09-23':1,'2025-10-13':1,'2025-11-03':1,'2025-11-23':1,'2025-11-24':1,'2026-01-01':1,'2026-01-12':1,'2026-02-11':1,'2026-02-23':1,'2026-03-20':1,'2026-04-29':1,'2026-05-03':1,'2026-05-04':1,'2026-05-05':1,'2026-05-06':1,'2026-07-20':1,'2026-08-11':1,'2026-09-21':1,'2026-09-22':1,'2026-09-23':1,'2026-10-12':1,'2026-11-03':1,'2026-11-23':1};
function isHol(d){return !!HOL[d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())];}
function pad(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());}
function fmt(s){return pad(Math.floor(s/60))+':'+pad(s%60);}
function dayLabel(dStr){
  const t=new Date(dStr.replace(/\//g,'-')+'T00:00:00');
  const dw=['日','月','火','水','木','金','土'];
  return (t.getMonth()+1)+'月'+t.getDate()+'日（'+dw[t.getDay()]+'）';
}
function getMtg(mon){const m=new Date(mon);if(isHol(m)){const t=new Date(m);t.setDate(m.getDate()+1);return{date:t,shifted:true};}return{date:m,shifted:false};}
function getMtgsInMonth(y,mo){
  const res=[];const d=new Date(y,mo,1);
  while(d.getDay()!==1)d.setDate(d.getDate()+1);
  while(d.getMonth()===mo){const i=getMtg(new Date(d));res.push({mtg:i.date,shifted:i.shifted});d.setDate(d.getDate()+7);}
  return res;
}
function ld(){try{return JSON.parse(localStorage.getItem('meety1')||'{}');}catch{return{};}}
function sv(){try{localStorage.setItem('meety1',JSON.stringify(ST));}catch{}}
const DEF=[{title:'前回の振り返り',min:5,subs:[]},{title:'業務報告（各自）',min:10,subs:[]},{title:'課題・問題共有',min:10,subs:[]},{title:'スケジュール確認',min:5,subs:[]},{title:'連絡事項・その他',min:5,subs:[]}];
let ST=ld();
if(!ST.ag)ST.ag=JSON.parse(JSON.stringify(DEF));
if(!ST.hist)ST.hist=[];
ST.ag.forEach(a=>{if(!a.subs)a.subs=[];});
if(!ST.topics)ST.topics={};
let calY=new Date().getFullYear(),calM=new Date().getMonth();
let selDs=null,curTab=0,tIv=null,tElapsed=0,tRunning=false,tLimit=0,curIdx=0;

(function(){
  const n=new Date();
  const dw=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  document.getElementById('hDate').textContent=dw[n.getDay()]+' '+pad(n.getMonth()+1)+'.'+pad(n.getDate());
})();

const slider=document.getElementById('slider');
let tx=0,ty=0;
slider.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
slider.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>44){
    if(dx<0&&curTab<2)goTab(curTab+1);
    else if(dx>0&&curTab>0)goTab(curTab-1);
  }
},{passive:true});

function goTab(n){
  curTab=n;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===n));
  slider.style.transform=`translateX(-${n*100}%)`;
  if(n===1)renderAgenda();
  if(n===2)renderSettings();
}

function renderCal(){
  const mns=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('calLbl').textContent=mns[calM]+' '+calY;
  const mtgs=getMtgsInMonth(calY,calM);
  const mtgMap={};mtgs.forEach(m=>{mtgMap[m.mtg.getDate()+'_'+calM]=m;});
  const now=new Date();now.setHours(0,0,0,0);
  const todayDs=ds(now);
  const histDs=new Set(ST.hist.map(h=>h.date));
  const first=new Date(calY,calM,1);
  let sd=first.getDay();sd=sd===0?6:sd-1;
  const dim=new Date(calY,calM+1,0).getDate();
  const prev=new Date(calY,calM,0).getDate();
  let h='<div class="cal-dow">M</div><div class="cal-dow">T</div><div class="cal-dow">W</div><div class="cal-dow">T</div><div class="cal-dow">F</div><div class="cal-dow">S</div><div class="cal-dow">S</div>';
  for(let i=0;i<sd;i++)h+=`<div class="cal-day out">${prev-sd+1+i}</div>`;
  for(let d=1;d<=dim;d++){
    const dObj=new Date(calY,calM,d);
    const mi=mtgMap[d+'_'+calM];
    const dStr=ds(dObj);
    const isT=dStr===todayDs;
    const hasR=mi&&histDs.has(ds(mi.mtg));
    if(mi){
      let cls='cal-day mtg'+(isT?' today':'')+(hasR?' has-rec':'');
      h+=`<div class="${cls}" onclick="selDate('${ds(mi.mtg)}')">${d}</div>`;
    } else {
      h+=`<div class="cal-day${isHol(dObj)?' hol':''}">${d}</div>`;
    }
  }
  const rem=(sd+dim)%7;for(let i=1;i<=(rem?7-rem:0);i++)h+=`<div class="cal-day out">${i}</div>`;
  document.getElementById('calGrid').innerHTML=h;
}
function shiftM(d){calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}renderCal();}

function renderUp(){
  const now=new Date();now.setHours(0,0,0,0);
  const list=[];const p=new Date(now);
  while(list.length<4&&(p-now)<1000*60*60*24*60){
    if(p.getDay()===1){const i=getMtg(new Date(p));list.push({dStr:ds(i.date),shifted:i.shifted});}
    p.setDate(p.getDate()+1);
  }
  document.getElementById('upList').innerHTML=list.map((u,i)=>`
    <div class="up-card${i>0?' dim':''}" onclick="selDate('${u.dStr}')">
      <div class="up-card-left">
        <div class="up-card-date">${dayLabel(u.dStr)}</div>
        <div class="up-card-title">週次定例ミーティング</div>
        ${u.shifted?'<div class="up-card-note">祝日のため火曜開催</div>':''}
      </div>
      <div class="up-card-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>`).join('');
}
function selDate(dStr){selDs=dStr;goTab(1);}

function getTodayTopics(){return selDs&&ST.topics[selDs]?ST.topics[selDs]:[];}
function saveTodayTopics(){sv();showToast('保存しました');}
function renderTopics(){
  if(!selDs){document.getElementById('todayTopicWrap').style.opacity='0.4';return;}
  document.getElementById('todayTopicWrap').style.opacity='1';
  const topics=getTodayTopics();
  const el=document.getElementById('topicList');
  if(!topics.length){el.innerHTML='<div class="topic-empty">まだ追加されていません</div>';return;}
  el.innerHTML=topics.map((t,i)=>`
    <div class="topic-item">
      <div class="topic-item-dot"></div>
      <span class="topic-item-text">${t}</span>
      <button class="topic-item-del" onclick="delTopic(${i})">✕</button>
    </div>`).join('');
}
function addTopic(){
  if(!selDs){showToast('カレンダーから日付を選択してください');return;}
  const inp=document.getElementById('topicInput');
  const val=inp.value.trim();
  if(!val)return;
  if(!ST.topics[selDs])ST.topics[selDs]=[];
  ST.topics[selDs].push(val);
  inp.value='';
  sv();renderTopics();
}
function delTopic(i){
  if(!selDs||!ST.topics[selDs])return;
  ST.topics[selDs].splice(i,1);
  sv();renderTopics();
}
function renderAgenda(){
  document.getElementById('agDateLbl').textContent=selDs?dayLabel(selDs):'— Select a date —';
  const last=ST.hist.length?ST.hist[ST.hist.length-1]:null;
  const pt=document.getElementById('prevTags');
  if(last&&last.memo&&last.memo.trim()){
    pt.innerHTML=last.memo.split('\n').filter(l=>l.trim()).map(l=>`<span class="prev-tag">${l}</span>`).join('');
  } else {
    pt.innerHTML='<span class="no-memo">記録なし</span>';
  }
  const RCOLS=['#e84040','#e07820','#c8a820','#40a860','#2888cc','#7040c0'];
  document.getElementById('agList').innerHTML=ST.ag.map((a,i)=>{
    const col=RCOLS[i%RCOLS.length];
    const subHtml=(a.subs&&a.subs.length)?`<div class="sub-list">${a.subs.map(s=>`<div class="sub-row" style="border-left-color:${col}88;"><div class="sub-bullet" style="background:${col}88;"></div><span class="sub-name">${s}</span></div>`).join('')}</div>`:'';
    return `<div class="ag-row-wrap">
      <div class="ag-row" style="border-left-color:${col};">
        <span class="ag-num" style="color:${col};">${pad(i+1)}</span>
        <span class="ag-name">${a.title}</span>
        <span class="ag-min">${a.min}min</span>
      </div>
      ${subHtml}
    </div>`;
  }).join('');
  renderTopics();
}

function openTimer(){
  if(!selDs){showToast('カレンダーから日付を選択してください');return;}
  curIdx=0;tElapsed=0;tRunning=false;clearInterval(tIv);
  document.getElementById('tBody').style.cssText='display:flex;flex-direction:column;';
  document.getElementById('tDone').style.display='none';
  document.getElementById('timerOv').classList.add('show');
  renderTimer();
}
function closeTimer(){clearInterval(tIv);tRunning=false;document.getElementById('timerOv').classList.remove('show');}
function renderTimer(){
  if(curIdx>=ST.ag.length){showDone();return;}
  const ag=ST.ag[curIdx];tLimit=ag.min*60;
  const RCOLS2=['#e84040','#e07820','#c8a820','#40a860','#2888cc','#7040c0'];
  const curCol=RCOLS2[curIdx%RCOLS2.length];
  document.getElementById('tStep').textContent=pad(curIdx+1)+' / '+pad(ST.ag.length);
  document.getElementById('tTopic').textContent=ag.title;
  document.getElementById('tTopic').style.color=curCol;
  document.getElementById('tStartBtn').style.background=curCol;
  document.getElementById('tStartBtn').style.borderColor=curCol;
  updT();
  const RCOLS3=['#e84040','#e07820','#c8a820','#40a860','#2888cc','#7040c0'];
  document.getElementById('tDots').innerHTML=ST.ag.map((_,i)=>{
    if(i===curIdx) return `<div class="sdot cur" style="background:${RCOLS3[i%RCOLS3.length]};"></div>`;
    if(i<curIdx) return `<div class="sdot done" style="background:${RCOLS3[i%RCOLS3.length]}88;"></div>`;
    return `<div class="sdot"></div>`;
  }).join('');
  const subs=ag.subs||[];
  const tSubEl=document.getElementById('tSubs');
  if(subs.length){
    tSubEl.style.display='block';
    tSubEl.innerHTML=subs.map((s,si)=>`
      <div class="timer-sub-item" onclick="toggleSub(${si})" id="tsub_${si}">
        <div class="tsub-chk" id="tschk_${si}"></div>
        <span class="tsub-txt" id="tstxt_${si}">${s}</span>
      </div>`).join('');
  } else {
    tSubEl.style.display='none';
    tSubEl.innerHTML='';
  }
}
function updT(){
  const rem=Math.max(0,tLimit-tElapsed);const warn=rem<60&&tElapsed>0;
  const el=document.getElementById('tDigits');
  el.textContent=fmt(rem);el.className='timer-digits'+(warn?' warn':'');
  const f=document.getElementById('tFill');
  f.style.width=tLimit?Math.round(rem/tLimit*100)+'%':'100%';
  f.className='timer-fill'+(warn?' warn':'');
  document.getElementById('tStat').textContent=tRunning?'Running':(tElapsed>0?'Paused':'Stopped');
}
function tStart(){
  if(tRunning||curIdx>=ST.ag.length)return;
  tRunning=true;document.getElementById('tStartBtn').textContent='Running';
  tIv=setInterval(()=>{tElapsed++;updT();if(tElapsed>=tLimit){clearInterval(tIv);tRunning=false;document.getElementById('tStartBtn').textContent='Start';document.getElementById('tStat').textContent='Time up!';}},1000);
}
function tPause(){clearInterval(tIv);tRunning=false;document.getElementById('tStartBtn').textContent='Start';updT();}
function tReset(){tPause();tElapsed=0;updT();}
function toggleSub(si){
  const chk=document.getElementById('tschk_'+si);
  const txt=document.getElementById('tstxt_'+si);
  if(!chk||!txt)return;
  chk.classList.toggle('chk');
  txt.classList.toggle('chk');
}
function tNext(){tPause();tElapsed=0;curIdx++;if(curIdx>=ST.ag.length)showDone();else renderTimer();}
function showDone(){
  document.getElementById('tBody').style.display='none';
  document.getElementById('tDone').style.display='flex';
  document.getElementById('memoTa').value='';
  const topics=getTodayTopics();
  const el=document.getElementById('doneTodayTopics');
  if(topics.length){
    el.innerHTML=`<div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-bottom:8px;">今日のトピック</div>`
      +topics.map(t=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--text2);"><span style="color:var(--accent);">·</span>${t}</div>`).join('')
      +`<div style="height:1px;background:var(--border);margin:12px 0;"></div>`;
  } else { el.innerHTML=''; }
}
function saveMemo(){ST.hist.push({date:selDs||ds(new Date()),memo:document.getElementById('memoTa').value});if(ST.hist.length>30)ST.hist=ST.hist.slice(-30);sv();renderCal();closeTimer();showToast('保存しました');}

function renderSettings(){
  document.getElementById('editRows').innerHTML=ST.ag.map((a,i)=>{
    const subs=a.subs||[];
    const subHtml=subs.map((s,si)=>`
      <div class="sub-edit-row">
        <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);min-width:14px;">↳</span>
        <input class="sub-edit-input" value="${s}" oninput="ST.ag[${i}].subs[${si}]=this.value;sv();"/>
        <button class="xbtn-sm" onclick="delSub(${i},${si})">✕</button>
      </div>`).join('');
    return `
    <div class="setting-block" style="border-bottom:none;">
      <div class="setting-row" style="border-bottom:none;padding-bottom:6px;">
        <input class="edit-input" value="${a.title}" oninput="ST.ag[${i}].title=this.value;sv();"/>
        <input class="edit-input num-input" type="number" value="${a.min}" min="1" max="90" oninput="ST.ag[${i}].min=parseInt(this.value)||5;sv();" style="width:50px;"/>
        <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);">min</span>
        <button class="xbtn" onclick="delRow(${i})">✕</button>
      </div>
      ${subHtml?`<div class="sub-edit-area">${subHtml}</div>`:''}
      <div class="sub-edit-area" style="background:none;border:none;">
        <button class="add-sub-btn" onclick="addSub(${i})">＋ サブ追加</button>
      </div>
      <div style="height:1px;background:var(--border);margin:0 20px;"></div>
    </div>`;
  }).join('');
}
function addRow(){ST.ag.push({title:'新しい議題',min:5,subs:[]});sv();renderSettings();}
function addSub(i){if(!ST.ag[i].subs)ST.ag[i].subs=[];ST.ag[i].subs.push('');sv();renderSettings();}
function delSub(i,si){ST.ag[i].subs.splice(si,1);sv();renderSettings();}
function delRow(i){ST.ag.splice(i,1);sv();renderSettings();}
function clearHistory(){if(confirm('記録をすべて削除しますか？')){ST.hist=[];sv();renderCal();showToast('削除しました');}}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

renderCal();renderUp();goTab(0);
</script>
</body>
</html>
